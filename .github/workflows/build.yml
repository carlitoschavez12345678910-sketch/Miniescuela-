name: Compilar EBOOT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - name: Guardar EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: MiniEscuela-EBOOT
          path: EBOOT.PBP 
